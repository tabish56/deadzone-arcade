
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>DEADZONE: ARCADE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background: #111;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background: #080a0a;
      z-index: 10;
    }

    #loading h1 {
      color: #ff4141;
      letter-spacing: 3px;
    }

    #status {
      max-width: 520px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #retry {
      display: none;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #e63232;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="loading">
    <h1>DEADZONE</h1>
    <p id="status">Connecting to Discord...</p>
    <button id="retry" type="button" onclick="location.reload()">
      Retry Connection
    </button>
  </div>

  <canvas
    id="gameCanvas"
    width="800"
    height="600"
    style="display:none"
  ></canvas>

  <!-- Discord initialization runs only after game.js has loaded. -->
  <script src="./game.js"></script>

  <script type="module">
    const CLIENT_ID = "156356803156784356";

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const canvas = document.getElementById("gameCanvas");
    const retry = document.getElementById("retry");

    let gameStarted = false;

    function showError(message) {
      console.error("[DEADZONE]", message);
      status.textContent = message;
      retry.style.display = "inline-block";
    }

    function startGame() {
      if (gameStarted) return;

      if (typeof window.initGameEngine !== "function") {
        showError(
          "Game engine not found. Check that public/game.js loaded correctly."
        );
        return;
      }

      gameStarted = true;
      loading.style.display = "none";
      canvas.style.display = "block";

      try {
        window.initGameEngine();
      } catch (error) {
        gameStarted = false;
        loading.style.display = "flex";
        canvas.style.display = "none";
        showError("Game initialization failed: " + error.message);
      }
    }

    async function start() {
      const isDiscord =
        new URLSearchParams(location.search).has("frame_id") ||
        window.self !== window.top;

      // Allow ordinary local browser testing without Discord authentication.
      if (!isDiscord) {
        startGame();
        return;
      }

      try {
        status.textContent = "Loading Discord Embedded App SDK...";

        const { DiscordSDK } = await import(
          "https://esm.sh/@discord/embedded-app-sdk"
        );

        const discordSdk = new DiscordSDK(CLIENT_ID);

        status.textContent = "Connecting to Discord...";
        
await Promise.race([
  discordSdk.ready(),
  new Promise((_, reject) =>
    setTimeout(
      () => reject(new Error(
        "Discord SDK connection timed out. Check Activity launch and URL Mapping."
      )),
      10000
    )
  )
]);


        status.textContent = "Authorizing player...";

        const { code } = await discordSdk.commands.authorize({
          client_id: CLIENT_ID,
          response_type: "code",
          state: "",
          prompt: "none",
          scope: ["identify"]
        });

        if (!code) {
          throw new Error("Discord did not return an authorization code.");
        }

        status.textContent = "Verifying authorization...";

        const response = await fetch("/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const tokenData = await response.json();

        if (!response.ok || !tokenData.access_token) {
          throw new Error(
            tokenData.message ||
            tokenData.error ||
            "The server could not exchange the authorization code."
          );
        }

        status.textContent = "Authenticating player...";

        const auth = await discordSdk.commands.authenticate({
          access_token: tokenData.access_token
        });

        if (!auth) {
          throw new Error("Discord authentication was unsuccessful.");
        }

        startGame();
      } catch (error) {
        showError(
          "Discord launch failed: " +
          (error?.message || "Unknown error") +
          ". Check the browser console and Render server logs."
        );
      }
    }

    start();
  </script>
</body>
</html>
