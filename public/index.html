<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADZONE: ARCADE</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background: #000; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: sans-serif;
            touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        canvas { 
            background: #111; 
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            max-width: 100vw; max-height: 100vh; object-fit: contain;
        }
        #loading { color: white; font-size: 24px; position: absolute; text-align: center; }
    </style>
    <script src="https://remix.technology"></script>
</head>
<body>
    <div id="loading">Loading Arena...</div>
    <canvas id="gameCanvas" width="800" height="600" style="display:none;"></canvas>

    <script>
        let discordSdk = null;

        function launchLocalFallback() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            if (typeof initGameEngine === "function") {
                initGameEngine();
            }
        }

        async function start() {
            // Check if running inside the Discord Activity application window
            const isInDiscord = window.self !== window.top || navigator.userAgent.includes("Discord");

            if (!isInDiscord) {
                // If running locally in Chrome/Edge, skip Discord setup and play instantly
                launchLocalFallback();
                return;
            }

            try {
                discordSdk = new Discord.DiscordSDK("YOUR_CLIENT_ID_HERE");
                await discordSdk.ready();
                
                const { code } = await discordSdk.commands.authorize({
                    client_id: "YOUR_CLIENT_ID_HERE",
                    response_type: "code",
                    scope: ["identify"],
                });

                const res = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const tokenData = await res.json();
                await discordSdk.commands.authenticate({ access_token: tokenData.access_token });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('gameCanvas').style.display = 'block';
            } catch (e) {
                launchLocalFallback();
            }
        }
        window.addEventListener('DOMContentLoaded', start);
    </script>
    <script src="game.js"></script>
</body>
</html>
