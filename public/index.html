
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>DEADZONE: LAST SURVIVOR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #111;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background: #080a0a;
    }

    #loading h1 {
      color: #ff4141;
      letter-spacing: 3px;
    }

    #status {
      max-width: 520px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #retry {
      display: none;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #e63232;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="loading">
    <h1>DEADZONE</h1>
    <p id="status">Starting DEADZONE...</p>
    <button id="retry" type="button">Retry Connection</button>
  </div>

  <canvas
    id="gameCanvas"
    width="800"
    height="600"
    style="display: none"
  ></canvas>

  <script src="/socket.io/socket.io.js"></script>
<script src="./game.js"></script>

  <script type="module">
    const CLIENT_ID = "1563568031567843568";

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const canvas = document.getElementById("gameCanvas");
    const retry = document.getElementById("retry");

    let gameStarted = false;

    retry.addEventListener("click", () => {
      location.reload();
    });

    function showError(message) {
      console.error("[DEADZONE]", message);
      status.textContent = message;
      retry.style.display = "inline-block";
    }

    function startGame() {
      if (gameStarted) return;

      if (typeof window.initGameEngine !== "function") {
        showError(
          "Game engine not found. Check that public/game.js loaded correctly."
        );
        return;
      }

      try {
        window.initGameEngine();
        gameStarted = true;
        canvas.style.display = "block";
        loading.style.display = "none";
      } catch (error) {
        console.error("[DEADZONE] Game initialization error:", error);
        canvas.style.display = "none";
        loading.style.display = "flex";
        showError("Game initialization failed: " + error.message);
      }
    }

    async function start() {
      const params = new URLSearchParams(location.search);

      const isDiscord =
        params.has("frame_id") ||
        window.self !== window.top;

      // Allow direct browser testing outside Discord.
      if (!isDiscord) {
        startGame();
        return;
      }

      try {
        status.textContent = "Loading Discord SDK...";

        const { DiscordSDK } = await import(
          "https://esm.sh/@discord/embedded-app-sdk"
        );

        const discordSdk = new DiscordSDK(CLIENT_ID);

        status.textContent = "Connecting to Discord...";

        let timeoutId;

        try {
          await Promise.race([
            discordSdk.ready(),
            new Promise((_, reject) => {
              timeoutId = setTimeout(() => {
                reject(
                  new Error(
                    "Discord connection timed out. Check the Activity URL Mapping and Application ID."
                  )
                );
              }, 10000);
            })
          ]);
        } finally {
          clearTimeout(timeoutId);
        }

        status.textContent = "Authorizing player...";

        const { code } = await discordSdk.commands.authorize({
          client_id: CLIENT_ID,
          response_type: "code",
          state: "",
          prompt: "none",
          scope: ["identify"]
        });

        if (!code) {
          throw new Error(
            "Discord did not return an authorization code."
          );
        }

        status.textContent = "Verifying authorization...";

        // Discord's Activity proxy forwards this to the app's
        // backend endpoint at /api/token.
        const response = await fetch("/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const responseText = await response.text();

let tokenData;

try {
  tokenData = JSON.parse(responseText);
} catch {
  throw new Error(
    "Token endpoint returned HTML instead of JSON. " +
    "HTTP status: " + response.status +
    ". Check the /api/token route in Render."
  );
}

        if (!response.ok || !tokenData.access_token) {
          throw new Error(
            tokenData.message ||
            tokenData.error ||
            "Token exchange failed. Check Render logs and OAuth settings."
          );
        }

        status.textContent = "Authenticating player...";

        const auth = await discordSdk.commands.authenticate({
          access_token: tokenData.access_token
        });

        if (!auth) {
          throw new Error(
            "Discord authentication was unsuccessful."
          );
        }

        startGame();

      } catch (error) {
        console.error("[DEADZONE] Discord startup failed:", error);

        showError(
          "Discord launch failed: " +
          (error?.message || "Unknown error")
        );
      }
    }

    start();
  </script>
</body>
</html>
